<!doctype html>
<html lang="es">
  <body
    style="
      margin: 0;
      padding: 32px 16px;
      background: #f7f5f0;
      color: #1d1c1a;
      font-family:
        -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Arial,
        sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="max-width: 480px; margin: 0 auto"
    >
      <tr>
        <td
          style="
            background: #fdfcf9;
            border: 1px solid rgba(29, 28, 26, 0.12);
            border-radius: 22px;
            padding: 28px 24px;
          "
        >
          <p style="margin: 0 0 20px; font-size: 18px; font-weight: 800">
            Venduo
          </p>
          <h1
            style="
              margin: 0 0 12px;
              font-size: 26px;
              line-height: 1.1;
              font-weight: 800;
              letter-spacing: -0.02em;
            "
          >
            Elige tu contraseña nueva.
          </h1>
          <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.5">
            Nos pediste un enlace para volver a entrar a tu tienda. Tócalo y
            elige una contraseña nueva. Sirve una sola vez y vence en una hora.
          </p>
          <a
            href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=recovery&next=/nueva-clave"
            style="
              display: inline-block;
              background: #1d1c1a;
              color: #ffffff;
              text-decoration: none;
              font-weight: 600;
              font-size: 15px;
              padding: 14px 24px;
              border-radius: 999px;
            "
            >Elegir mi contraseña</a
          >
          <p
            style="
              margin: 24px 0 0;
              font-size: 13px;
              line-height: 1.5;
              color: rgba(29, 28, 26, 0.65);
            "
          >
            Si no lo pediste, no hagas nada: tu contraseña sigue siendo la
            misma.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
