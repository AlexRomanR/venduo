name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Pruebas
        run: npm test

      - name: Build
        run: npm run build
        env:
          # El build tiene que pasar sin credenciales: modo demo.
          AI_PROVIDER: mock

  # Las pruebas de la base corren sobre una base local, armada desde las
  # migraciones. Este job no tiene credenciales: no puede llegar a producción.
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Base local
        run: npx supabase db start

      - name: Pruebas de la base
        run: npx supabase test db --local
